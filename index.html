<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasKita V2 - Aplikasi Kasir Pintar</title>
    <!-- Script Tailwind CSS untuk tampilan cantik dan responsif otomatis -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Kotak Putih Utama -->
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <!-- Logo Text -->
        <h1 class="text-4xl font-extrabold text-slate-800 mb-2 tracking-tight">
            Kas<span class="text-blue-600">Kita</span>
        </h1>
        <p class="text-slate-500 mb-8">Sistem Pembukuan & Kasir Multi-Usaha</p>

        <!-- Form Input URL Database -->
        <div id="setup-section" class="text-left space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">URL Database Toko (Apps Script)</label>
                <input type="url" id="db-url" placeholder="https://script.google.com/.../exec"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
            </div>
            
            <button onclick="simpanURL()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-blue-200">
                Sambungkan & Buka Toko
            </button>
            
            <p class="text-xs text-slate-400 mt-4 text-center leading-relaxed">
                Aplikasi ini menggunakan sistem <b>Bring Your Own Database</b>.<br>Seluruh data penjualan tersimpan aman 100% di Google Drive milik Anda sendiri.
            </p>
        </div>
    </div>

    <!-- Logika Javascript Sederhana -->
    <script>
        // Mengecek apakah sebelumnya sudah pernah login
        window.onload = function() {
            const savedUrl = localStorage.getItem("kaskita_db_url");
            if(savedUrl) {
                document.getElementById('db-url').value = savedUrl;
            }
        }

        // Fungsi menyimpan URL ke HP pengguna
        function simpanURL() {
            const url = document.getElementById('db-url').value;
            if(url.includes("script.google.com") && url.endsWith("/exec")) {
                localStorage.setItem("kaskita_db_url", url);
                alert("✅ Database Toko Berhasil Disambungkan!\n\n(Halaman menu kasir akan kita bangun di tahap selanjutnya).");
            } else {
                alert("❌ URL tidak valid. Pastikan itu adalah link /exec dari Google Apps Script.");
            }
        }
    </script>
</body>
</html>
