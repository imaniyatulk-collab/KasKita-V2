<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasKita V2 - Aplikasi Kasir Pintar</title>
    
    <!-- Pengaturan PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- ========================================== -->
    <!-- HALAMAN 1: SETUP (Tampil saat belum login) -->
    <!-- ========================================== -->
    <div id="setup-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-2 tracking-tight">
                Kas<span class="text-blue-600">Kita</span>
            </h1>
            <p class="text-slate-500 mb-8">Sistem Pembukuan & Kasir Multi-Usaha</p>

            <div class="text-left space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">URL Database Toko (Apps Script)</label>
                    <input type="url" id="db-url" placeholder="https://script.google.com/.../exec"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
                </div>
                <button onclick="simpanURL()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-blue-200">
                    Sambungkan & Buka Toko
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- HALAMAN 2: DASHBOARD KASIR                 -->
    <!-- ========================================== -->
    <div id="pos-section" class="hidden h-screen flex flex-col">
        
        <!-- Header / Navbar -->
        <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-bold tracking-tight">Kas<span class="text-blue-200">Kita</span></h1>
                <span class="bg-blue-800 text-xs px-2 py-1 rounded-full">Toko Saya</span>
            </div>
            <button onclick="keluarToko()" class="text-sm bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded-lg font-semibold transition">
                Ganti Toko
            </button>
        </header>

        <!-- Area Utama: Produk & Keranjang -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
            
            <!-- Kiri: Daftar Produk -->
            <main class="flex-1 bg-slate-100 p-4 overflow-y-auto">
                <h2 class="font-bold text-slate-600 mb-4">Pilih Produk</h2>
                
                <!-- Grid Produk (Diisi oleh JavaScript) -->
                <div id="grid-produk" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- Produk akan muncul di sini -->
                </div>
            </main>

            <!-- Kanan: Keranjang Pesanan -->
            <aside class="w-full md:w-96 bg-white border-t md:border-t-0 md:border-l border-slate-200 flex flex-col shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-none z-20">
                <div class="p-4 border-b border-slate-100 bg-white">
                    <h2 id="judul-keranjang" class="font-bold text-lg text-slate-800">Keranjang (0)</h2>
                </div>
                
                <!-- Daftar Item di Keranjang (Diisi oleh JavaScript) -->
                <div id="daftar-keranjang" class="flex-1 p-4 overflow-y-auto bg-slate-50 flex flex-col gap-3">
                    <div class="h-full flex items-center justify-center text-slate-400 text-sm">
                        <p>Belum ada produk yang dipilih</p>
                    </div>
                </div>

                <!-- Total & Tombol Bayar -->
                <div class="p-4 bg-white border-t border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-slate-600">Total Tagihan</span>
                        <span id="total-harga" class="text-2xl font-black text-blue-600">Rp 0</span>
                    </div>
                    <button onclick="prosesBayar()" class="w-full bg-green-500 hover:bg-green-600 active:bg-green-700 text-white font-bold py-4 rounded-xl text-lg transition-colors shadow-lg shadow-green-200">
                        Bayar Sekarang
                    </button>
                </div>
            </aside>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- LOGIKA JAVASCRIPT APLIKASI                 -->
    <!-- ========================================== -->
    <script>
        // --- DATA SEMENTARA (Nanti akan diambil dari Google Sheets) ---
        const produkData = [
            { id: 1, nama: 'Pensil 2B Faber Castell', harga: 4000, icon: '✏️' },
            { id: 2, nama: 'Kertas HVS A4 70gsm', harga: 55000, icon: '📄' },
            { id: 3, nama: 'Gunting Joyko Besar', harga: 12000, icon: '✂️' },
            { id: 4, nama: 'Spidol Hitam Snowman', harga: 8500, icon: '🖊️' },
            { id: 5, nama: 'Buku Tulis Sinar Dunia', harga: 4500, icon: '📓' },
            { id: 6, nama: 'Penghapus Joyko', harga: 2000, icon: '🧽' }
        ];

        let keranjang = []; // Menyimpan daftar pesanan

        // --- FUNGSI KONTROL HALAMAN ---
        const setupSection = document.getElementById('setup-section');
        const posSection = document.getElementById('pos-section');
        const dbUrlInput = document.getElementById('db-url');

        window.onload = function() {
            const savedUrl = localStorage.getItem("kaskita_db_url");
            if(savedUrl) { bukaMesinKasir(); }
            renderProduk(); // Tampilkan produk saat aplikasi dimuat
        }

        function simpanURL() {
            const url = dbUrlInput.value;
            if(url.includes("script.google.com") && url.endsWith("/exec")) {
                localStorage.setItem("kaskita_db_url", url);
                bukaMesinKasir();
            } else {
                alert("❌ URL tidak valid.");
            }
        }

        function bukaMesinKasir() {
            setupSection.classList.add('hidden');
            setupSection.classList.remove('flex');
            posSection.classList.remove('hidden');
        }

        function keluarToko() {
            if(confirm("Anda yakin ingin keluar?")) {
                localStorage.removeItem("kaskita_db_url");
                dbUrlInput.value = "";
                posSection.classList.add('hidden');
                setupSection.classList.remove('hidden');
                setupSection.classList.add('flex');
            }
        }

        // --- FUNGSI MESIN KASIR ---
        
        // Mengubah angka menjadi format Rupiah (Rp 10.000)
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Menampilkan daftar produk ke layar
        function renderProduk() {
            const grid = document.getElementById('grid-produk');
            grid.innerHTML = '';
            
            produkData.forEach(p => {
                grid.innerHTML += `
                <div onclick="tambahKeKeranjang(${p.id})" class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-blue-300 cursor-pointer transition active:scale-95 flex flex-col justify-between">
                    <div class="h-20 bg-slate-50 rounded-lg mb-2 flex items-center justify-center text-4xl">${p.icon}</div>
                    <div>
                        <h3 class="font-semibold text-sm leading-tight mb-1 text-slate-700">${p.nama}</h3>
                        <p class="text-blue-600 font-bold text-sm">${formatRupiah(p.harga)}</p>
                    </div>
                </div>
                `;
            });
        }

        // Menambahkan barang ke keranjang
        function tambahKeKeranjang(idProduk) {
            const produk = produkData.find(p => p.id === idProduk);
            const itemDiKeranjang = keranjang.find(item => item.id === idProduk);

            if(itemDiKeranjang) {
                itemDiKeranjang.qty += 1; // Jika sudah ada, tambah jumlahnya
            } else {
                keranjang.push({ ...produk, qty: 1 }); // Jika belum, masukkan ke keranjang
            }
            
            renderKeranjang();
        }

        // Mengurangi jumlah barang di keranjang
        function kurangiDariKeranjang(idProduk) {
            const index = keranjang.findIndex(item => item.id === idProduk);
            if (index !== -1) {
                if (keranjang[index].qty > 1) {
                    keranjang[index].qty -= 1;
                } else {
                    keranjang.splice(index, 1); // Hapus jika qty = 0
                }
            }
            renderKeranjang();
        }

        // Memperbarui tampilan keranjang dan total harga
        function renderKeranjang() {
            const daftar = document.getElementById('daftar-keranjang');
            const judul = document.getElementById('judul-keranjang');
            const totalTeks = document.getElementById('total-harga');
            
            if(keranjang.length === 0) {
                judul.innerText = `Keranjang (0)`;
                daftar.innerHTML = `<div class="h-full flex items-center justify-center text-slate-400 text-sm"><p>Belum ada produk yang dipilih</p></div>`;
                totalTeks.innerText = formatRupiah(0);
                return;
            }

            daftar.innerHTML = '';
            let total = 0;
            let totalItem = 0;

            keranjang.forEach(item => {
                const subtotal = item.harga * item.qty;
                total += subtotal;
                totalItem += item.qty;

                daftar.innerHTML += `
                <div class="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center shadow-sm">
                    <div class="flex-1 pr-2">
                        <h4 class="font-semibold text-sm text-slate-800 line-clamp-1">${item.nama}</h4>
                        <p class="text-xs text-slate-500">${formatRupiah(item.harga)}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center bg-slate-100 rounded-lg">
                            <button onclick="kurangiDariKeranjang(${item.id})" class="w-8 h-8 flex items-center justify-center font-bold text-slate-600 hover:bg-slate-200 rounded-l-lg">-</button>
                            <span class="w-6 text-center font-bold text-sm">${item.qty}</span>
                            <button onclick="tambahKeKeranjang(${item.id})" class="w-8 h-8 flex items-center justify-center font-bold text-slate-600 hover:bg-slate-200 rounded-r-lg">+</button>
                        </div>
                        <span class="font-bold text-sm text-blue-600 w-20 text-right">${formatRupiah(subtotal)}</span>
                    </div>
                </div>
                `;
            });

            judul.innerText = `Keranjang (${totalItem})`;
            totalTeks.innerText = formatRupiah(total);
        }

        // Simulasi Tombol Bayar
        function prosesBayar() {
            if(keranjang.length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }
            alert("✅ Pembayaran Berhasil!\n\n(Nantinya data ini akan dikirim otomatis ke Google Sheets)");
            keranjang = []; // Kosongkan keranjang setelah bayar
            renderKeranjang();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
